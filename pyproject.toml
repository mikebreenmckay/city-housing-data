[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "housing"
version = "0.1.0"
description = "Housing affordability data for the largest US metro areas"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebooks = ["jupyter", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
